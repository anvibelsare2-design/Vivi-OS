</style></head><body><div class='app'><aside class='side'><div class='logo'>V<span>i</span>vi <small>OS</small></div><nav class='nav' id='nav'></nav></aside><main class='main'><div class='top'><div><div class='date' id='date'></div><h1 id='title'>Home</h1></div><div class='row'><button onclick='openModal("quick")' class='primary'>+ Add</button></div></div><div id='view'></div></main></div>
<div class='modal' id='modal'><div class='modalbox' id='modalbox'></div></div>
<script>
const KEY='vivi-os-v1'; const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function readSaved(){try{return localStorage.getItem(KEY)}catch(e){return null}} function writeSaved(v){try{localStorage.setItem(KEY,v)}catch(e){}}
let state=JSON.parse(readSaved()||'null')||{events:[
{id:1,title:'College',day:0,start:'07:00',end:'12:00',type:'fixed',active:true},{id:2,title:'College',day:1,start:'07:00',end:'12:00',type:'fixed',active:true},{id:3,title:'College',day:2,start:'07:00',end:'12:00',type:'fixed',active:true},{id:4,title:'College',day:3,start:'07:00',end:'12:00',type:'fixed',active:true},{id:5,title:'College',day:4,start:'07:00',end:'12:00',type:'fixed',active:true},{id:6,title:'Accounts',day:0,start:'17:00',end:'18:00',type:'fixed',active:true},{id:7,title:'Accounts',day:1,start:'17:00',end:'18:00',type:'fixed',active:true},{id:8,title:'Accounts',day:2,start:'17:00',end:'18:00',type:'fixed',active:true},{id:9,title:'Accounts',day:3,start:'17:00',end:'18:00',type:'fixed',active:true},{id:10,title:'Accounts',day:4,start:'17:00',end:'18:00',type:'fixed',active:true},{id:11,title:'Dance',day:0,start:'19:30',end:'21:00',type:'fixed',active:true},{id:12,title:'Dance',day:1,start:'18:30',end:'21:00',type:'fixed',active:true},{id:13,title:'Dance',day:2,start:'19:30',end:'21:00',type:'fixed',active:true},{id:14,title:'Dance',day:3,start:'19:30',end:'21:00',type:'fixed',active:true},{id:15,title:'Dance',day:4,start:'19:30',end:'21:00',type:'fixed',active:true},{id:16,title:'CLAT',day:5,start:'16:00',end:'19:00',type:'fixed',active:true},{id:17,title:'CLAT',day:6,start:'14:00',end:'19:30',type:'fixed',active:true}],tasks:[],topics:{College:[],CLAT:[], 'Dance Theory':[]},sessions:[],tests:[],mistakes:[],trackers:[{name:'Exercise',done:false},{name:'15 min walk',done:false},{name:'Journal',done:false},{name:'Water',done:false},{name:'Sleep on time',done:false}],settings:{procrastination:0,theme:'light',reminders:[],reminderEnabled:true}};
state.settings=Object.assign({procrastination:0,theme:'light',accent:'#6d5dfc',reminders:[],reminderEnabled:true,mood:3,showStats:true,showPriorities:true,showSchedule:true},state.settings||{}); state.settings.accent=state.settings.accent||'#6d5dfc'; state.eventOverrides=state.eventOverrides||{}; state.settings.reminders=state.settings.reminders||[]; function save(){writeSaved(JSON.stringify(state))} function applyTheme(){document.body.classList.remove('dark','blush','mint','sky'); if(state.settings.theme&&state.settings.theme!=='light')document.body.classList.add(state.settings.theme); document.documentElement.style.setProperty('--accent',state.settings.accent||'#6d5dfc')} function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const navItems=[['home','🏠','Home'],['calendar','🗓️','Calendar'],['tasks','✅','To-do'],['study','📚','Study'],['session','⏱️','Study Session'],['tests','🧪','Tests + Mistakes'],['track','📊','Trackers'],['search','🔍','Search'],['ai','🤖','Ask Vivi'],['settings','⚙️','Customize']];let page='home';
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class='${page===x[0]?'active':''}' onclick='go("${x[0]}")'>${x[1]} <span>${x[2]}</span></button>`).join('')}
function go(p){page=p;nav();render()} function render(){document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.getElementById('title').textContent=navItems.find(x=>x[0]===page)[2];({home,calendar,tasks,study,session,tests,track,search,ai,settings}[page])()}
function home(){let done=state.tasks.filter(x=>x.done).length,total=state.tasks.length,weekDone=state.sessions.length;let cards=[];if(state.settings.showSchedule)cards.push(`<div class='card span8'><h2>Today</h2><div class='list'>${todayEvents().map(e=>`<div class='item between'><div><b>${esc(e.title)}</b><div class='muted'>${e.start}–${e.end}</div></div><span class='pill'>${e.type==='fixed'?'Recurring':'Flexible'}</span></div>`).join('')||'<div class="muted">Nothing scheduled. Dangerous amount of freedom.</div>'}</div></div>`);if(state.settings.showPriorities)cards.push(`<div class='card span4'><h2>Today’s priorities</h2><div class='list'>${state.tasks.slice(0,5).map(t=>`<label class='check'><input type='checkbox' ${t.done?'checked':''} onchange='toggleTask(${t.id})'> <span>${esc(t.title)}</span></label>`).join('')||'<div class="muted">Add a task to get moving.</div>'}</div></div>`);if(state.settings.showStats)cards.push(`<div class='card span3'><div class='muted'>Tasks</div><div class='metric'>${done}/${total}</div></div><div class='card span3'><div class='muted'>Study sessions</div><div class='metric'>${weekDone}</div></div><div class='card span3'><div class='muted'>Procrastination</div><div class='metric'>${state.settings.procrastination}m</div></div><div class='card span3'><div class='muted'>Mood</div><div class='metric'>${['🌸','🙂','😤','💀'][state.settings.mood-1]||'🙂'}</div></div>`);cards.push(`<div class='card span12'><div class='between'><div><h2>🚨 Procrastination</h2><div class='muted'>Current total: ${state.settings.procrastination} minutes</div></div><button class='danger' onclick='procrastinate()'>I’m procrastinating</button></div></div>`);document.getElementById('view').innerHTML=`<div class='grid'>${cards.join('')}</div>`}
function todayEvents(){let di=(new Date().getDay()+6)%7;return state.events.flatMap(e=>{if(e.type==='fixed'){let x=eventForDate(e,di);return x?[x]:[]}return e.day===di&&e.active?[e]:[]})}
function mondayDate(){let d=new Date();d.setHours(0,0,0,0);let n=d.getDay();let diff=(n===0?-6:1-n);d.setDate(d.getDate()+diff);return d}
function isoDate(d){return d.toISOString().slice(0,10)}
function dayDate(i){let d=mondayDate();d.setDate(d.getDate()+i);return d}
function eventForDate(e,di){let d=dayDate(di),key=e.id+'|'+isoDate(d),o=state.eventOverrides[key];if(o&&o.cancelled)return null;return Object.assign({},e,o||{}, {date:isoDate(d),baseId:e.id,overridden:!!o});}
function calendar(){let hours=[];for(let h=6;h<=22;h++)hours.push(h);let cells='<div class="calhead">Time</div>'+days.map((d,i)=>{let dt=dayDate(i);return `<div class="calhead">${d}<br><span class="small muted">${dt.getDate()}/${dt.getMonth()+1}</span></div>`}).join('');for(let h of hours){cells+=`<div class='muted'>${String(h).padStart(2,'0')}:00</div>`+days.map((_,di)=>`<div>${state.events.flatMap(e=>{let x=e.type==='fixed'?eventForDate(e,di):(e.day===di&&e.active?Object.assign({},e,{date:isoDate(dayDate(di)),baseId:e.id}):null);return x?[x]:[]}).filter(e=>e&&e.active!==false&&parseInt(e.start)===h).map(e=>`<div class='event ${e.type==='flex'?'flex':''} ${e.overridden?'override':''}' onclick='editOccurrence(${e.baseId},"${e.date}")'>${esc(e.title)}<br><span class='small'>${e.start}–${e.end}</span></div>`).join('')}</div>`).join('')}document.getElementById('view').innerHTML=`<div class='card'><div class='between'><div><h2>This week's schedule</h2><div class='muted'>Recurring commitments repeat, but every occurrence can be cancelled or moved.</div></div><button class='primary' onclick='openModal("event")'>+ Add event</button></div><br><div class='calendar'>${cells}</div><br><div class='small muted'>Tap an event to edit only that occurrence, or change the recurring schedule.</div></div>`}
function tasks(){document.getElementById('view').innerHTML=`<div class='card'><div class='between'><h2>To-do</h2><button class='primary' onclick='openModal("task")'>+ Task</button></div><div class='list'>${state.tasks.map(t=>`<div class='item between'><label class='check'><input type='checkbox' ${t.done?'checked':''} onchange='toggleTask(${t.id})'><span><b>${esc(t.title)}</b><br><span class='small muted'>${esc(t.cat||'General')} ${t.due?'· '+esc(t.due):''} ${t.priority?'· '+esc(t.priority):''}</span></span></label><button class='danger' onclick='deleteTask(${t.id})'>Delete</button></div>`).join('')||'<div class="muted">No tasks yet.</div>'}</div></div>`}
function study(){document.getElementById('view').innerHTML=`<div class='tabs'>${['College','CLAT','Dance Theory'].map((x,i)=>`<button class='${i===0?'active':''}' onclick='studyTab("${x}",this)'>${x}</button>`).join('')}</div><div id='studybox'></div>`;studyTab('College')}
function studyTab(cat,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('studybox').innerHTML=`<div class='card'><div class='between'><div><h2>${cat}</h2><div class='muted'>Topics only — your actual notes stay elsewhere.</div></div><button class='primary' onclick='openModal("topic","${cat}")'>+ Sub-topic</button></div><div class='list' style='margin-top:12px'>${state.topics[cat].map((t,i)=>`<div class='item between'><div><b>${esc(t.name)}</b><br><span class='small muted'>${t.status||'Not started'}</span></div><div class='row'><button onclick='startTopic("${cat}",${i})'>Study</button><button class='danger' onclick='state.topics["${cat}"].splice(${i},1);save();studyTab("${cat}")'>×</button></div></div>`).join('')||'<div class="muted">Add your first sub-topic.</div>'}</div></div>`}
let timer={running:false,sec:1500,int:null,topic:''};function session(){document.getElementById('view').innerHTML=`<div class='grid'><div class='card span8'><h2>Pomodoro study session</h2><div class='muted'>Pick a topic, start the timer, and I’ll ask how it went.</div><div class='field'><label>Topic</label><select id='sessionTopic'><option value=''>Choose...</option>${Object.entries(state.topics).flatMap(([c,a])=>a.map(t=>`<option>${esc(c+' — '+t.name)}</option>`)).join('')}</select></div><div class='timer' id='timer'>${fmt(timer.sec)}</div><div class='row'><button class='primary' onclick='startTimer()'>▶ Start</button><button onclick='pauseTimer()'>⏸ Pause</button><button onclick='resetTimer()'>↺ Reset</button><button class='danger' onclick='procrastinate()'>🚨 I’m procrastinating</button></div></div><div class='card span4'><h2>Modes</h2><button class='bigbtn' onclick='setTimer(25)'>25 / 5</button><br><br><button class='bigbtn' onclick='setTimer(50)'>50 / 10</button><br><br><button class='bigbtn' onclick='setTimer(90)'>90 min</button></div></div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function setTimer(m){timer.sec=m*60;timer.running=false;clearInterval(timer.int);if(document.getElementById('timer'))document.getElementById('timer').textContent=fmt(timer.sec)}function startTimer(){let sel=document.getElementById('sessionTopic');if(!sel||!sel.value){alert('Pick a topic first.');return}timer.topic=sel.value;if(timer.running)return;timer.running=true;timer.int=setInterval(()=>{timer.sec--;if(document.getElementById('timer'))document.getElementById('timer').textContent=fmt(timer.sec);if(timer.sec<=0){pauseTimer();finishSession()}},1000)}function pauseTimer(){timer.running=false;clearInterval(timer.int)}function resetTimer(){setTimer(25)}function finishSession(){openModal('checkin')}
function tests(){document.getElementById('view').innerHTML=`<div class='grid'><div class='card span6'><div class='between'><h2>Tests</h2><button onclick='openModal("test")'>+ Test</button></div><div class='list'>${state.tests.map(t=>`<div class='item'><b>${esc(t.name)}</b><br>${t.score}/${t.total} · ${esc(t.date||'')}<br><span class='small muted'>${esc(t.topic||'')}</span></div>`).join('')||'<div class="muted">No tests recorded.</div>'}</div></div><div class='card span6'><div class='between'><h2>Mistakes</h2><button onclick='openModal("mistake")'>+ Mistake</button></div><div class='list'>${state.mistakes.map(m=>`<div class='item'><b>${esc(m.question)}</b><br><span class='small'>${esc(m.reason)}</span><br><span class='small muted'>${esc(m.correct)}</span></div>`).join('')||'<div class="muted">No mistakes logged.</div>'}</div></div></div>`}
function track(){document.getElementById('view').innerHTML=`<div class='grid'><div class='card span8'><div class='between'><h2>General trackers</h2><button onclick='openModal("tracker")'>+ Tracker</button></div><div class='list'>${state.trackers.map((t,i)=>`<label class='item check'><input type='checkbox' ${t.done?'checked':''} onchange='state.trackers[${i}].done=this.checked;save();track()'><span>${esc(t.name)}</span></label>`).join('')}</div></div><div class='card span4'><h2>Exercise schedule</h2><div class='muted'>Add workouts/walks as recurring or flexible calendar events, then mark the tracker when done.</div></div></div>`}
function settings(){document.getElementById('view').innerHTML=`<div class='grid'><div class='card span6'><h2>🎨 Customize Vivi</h2><div class='field'><label>Theme</label><select id='themeSelect' onchange='setTheme(this.value)'><option value='light' ${state.settings.theme==='light'?'selected':''}>☁️ Clean Light</option><option value='dark' ${state.settings.theme==='dark'?'selected':''}>🌙 Dark</option><option value='blush' ${state.settings.theme==='blush'?'selected':''}>🌸 Blush</option><option value='mint' ${state.settings.theme==='mint'?'selected':''}>🌿 Mint</option><option value='sky' ${state.settings.theme==='sky'?'selected':''}>🩵 Sky</option></select></div><div class='field'><label>Accent colour</label><div class='swatches'>${[['#6d5dfc','Violet'],['#e86b91','Pink'],['#3aa985','Mint'],['#4e86df','Sky'],['#ef8c3a','Orange'],['#e05252','Red']].map(x=>`<button class='swatch ${state.settings.accent===x[0]?'active':''}' title='${x[1]}' style='background:${x[0]}' onclick='setAccent("${x[0]}")'></button>`).join('')}</div></div><p class='muted small'>Pick the vibe. Your choices are saved on this device.</p></div><div class='card span6'><h2>😈 Vivi's attitude</h2><div class='muted'>How much should I nag you when you procrastinate?</div><div class='mood' style='margin-top:12px'>${[[1,'🌸 Gentle'],[2,'🙂 Normal'],[3,'😤 Firm'],[4,'💀 Savage']].map(x=>`<button class='${state.settings.mood===x[0]?'active':''}' onclick='setMood(${x[0]})'>${x[1]}</button>`).join('')}</div><p class='small muted'>You can change this anytime. Savage Vivi is optional. 😂</p></div><div class='card span6'><h2>🔔 Reminders</h2><p class='muted'>Reminders work while Vivi OS is open in your browser. Allow notifications when prompted.</p><div class='row'><button class='primary' onclick='requestNotifications()'>Enable notifications</button><button onclick='openModal("reminder")'>+ Reminder</button></div><div class='list' style='margin-top:12px'>${state.settings.reminders.map((r,i)=>`<div class='item between'><div><b>${esc(r.title)}</b><div class='muted'>${r.time} · ${r.repeat}</div></div><button class='danger' onclick='deleteReminder(${i})'>Delete</button></div>`).join('')||'<div class="muted">No reminders yet.</div>'}</div></div><div class='card span6'><h2>🏠 Home page</h2><div class='toggle'><span>Today's schedule</span><input type='checkbox' ${state.settings.showSchedule?'checked':''} onchange='toggleSetting("showSchedule",this.checked)'></div><div class='toggle'><span>Today's priorities</span><input type='checkbox' ${state.settings.showPriorities?'checked':''} onchange='toggleSetting("showPriorities",this.checked)'></div><div class='toggle'><span>Stats</span><input type='checkbox' ${state.settings.showStats?'checked':''} onchange='toggleSetting("showStats",this.checked)'></div></div><div class='card span12'><h2>✨ Vivi OS V1.3</h2><div class='row'><span class='pill'>Editable recurring occurrences</span><span class='pill'>Custom accent</span><span class='pill'>Vivi attitude</span><span class='pill'>Reminders</span><span class='pill'>Home controls</span></div></div></div>`}
function setTheme(t){state.settings.theme=t;save();applyTheme();settings()}function setAccent(a){state.settings.accent=a;save();applyTheme();settings()}function setMood(m){state.settings.mood=m;save();settings()}function toggleSetting(k,v){state.settings[k]=v;save();settings()}function requestNotifications(){if(!('Notification'in window)){alert('This browser does not support notifications.');return} Notification.requestPermission().then(x=>{alert(x==='granted'?'🔔 Notifications enabled! Keep Vivi OS open for timed reminders.':'Notifications were not enabled.')})}function deleteReminder(i){state.settings.reminders.splice(i,1);save();settings()}function checkReminders(){if(!state.settings.reminderEnabled)return;const now=new Date();const hm=now.toTimeString().slice(0,5);const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];state.settings.reminders.forEach(r=>{if(r.time!==hm)return;const key=r.id+'-'+now.toDateString();if(r.repeat==='Daily'||r.repeat===day){if(r.last!==key){r.last=key;save();if('Notification'in window&&Notification.permission==='granted')new Notification('Vivi OS',{body:r.title});else alert('🔔 '+r.title)}}})}setInterval(checkReminders,30000);
function search(){document.getElementById('view').innerHTML=`<div class='card'><h2>Search everything</h2><input id='q' oninput='doSearch()' placeholder='Search tasks, topics, tests, mistakes...' style='width:100%;padding:12px;border:1px solid var(--line);border-radius:12px'><div id='results' style='margin-top:15px'></div></div>`}function doSearch(){let q=document.getElementById('q').value.toLowerCase(),arr=[];state.tasks.forEach(x=>{if(x.title.toLowerCase().includes(q))arr.push('Task: '+x.title)});Object.entries(state.topics).forEach(([c,a])=>a.forEach(x=>{if((c+' '+x.name).toLowerCase().includes(q))arr.push('Study: '+c+' — '+x.name)}));state.tests.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))arr.push('Test: '+x.name)});state.mistakes.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))arr.push('Mistake: '+x.question)});document.getElementById('results').innerHTML=arr.length?arr.map(x=>`<div class='item'>${esc(x)}</div>`).join(''):'<div class="muted">No matches.</div>'}
function ai(){document.getElementById('view').innerHTML=`<div class='card'><h2>🤖 Ask Vivi</h2><div class='muted'>This V1 assistant uses your local app data. A real AI brain can be connected in the next build.</div><div class='assistant' style='margin-top:14px'><input id='aiq' placeholder='e.g. What should I do tonight?'><button class='primary' onclick='askAI()'>Ask</button></div><div id='air' style='margin-top:14px'></div></div>`}function askAI(){let q=document.getElementById('aiq').value.toLowerCase(),pending=state.tasks.filter(x=>!x.done),topics=Object.values(state.topics).flat().filter(x=>x.status!=='Done');let r=q.includes('behind')?`You have ${pending.length} unfinished tasks and ${topics.length} study topics not marked Done.`:q.includes('procrast')?`You've logged ${state.settings.procrastination} minutes of procrastination. The next move is one 25-minute session. No negotiation.`:q.includes('study')||q.includes('tonight')?`Start with: ${pending[0]?.title||topics[0]?.name||'your highest-priority study topic'}. Then do one Pomodoro. I am aggressively in favour of starting.`:`I can see ${pending.length} pending tasks, ${state.sessions.length} study sessions and ${state.tests.length} tests. Ask me about what to do, what you're behind on, or procrastination.`;document.getElementById('air').innerHTML=`<div class='bubble'>${esc(r)}</div>`}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}function deleteTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}function startTopic(cat,i){let t=state.topics[cat][i];t.status='In progress';save();go('session');setTimeout(()=>{let s=document.getElementById('sessionTopic');if(s)s.value=cat+' — '+t.name},50)}function procrastinate(){state.settings.procrastination+=5;save();let m=state.settings.mood||3;let msgs={1:'🌸 Okay. Reset. Just do five minutes.',2:'🙂 Yep, caught you. Put the phone down and start one tiny task.',3:'😤 Anvi. You literally told me to hold you accountable. BACK TO WORK.',4:'💀 THE SCROLLING ENDS NOW. CLOSE THE APP YOU ARE HIDING IN AND DO THE DAMN 25 MINUTES. 😭'};alert(msgs[m]);render()}
function editOccurrence(id,date){let e=state.events.find(x=>x.id===id);if(!e)return;openModal('editOccurrence',{event:e,date:date})}
function saveOccurrence(id,date){let e=state.events.find(x=>x.id===id);let key=id+'|'+date;state.eventOverrides[key]={title:document.getElementById('f_evtitle').value,start:document.getElementById('f_start').value,end:document.getElementById('f_end').value,day:+document.getElementById('f_day').value,active:true,overridden:true};save();closeModal();go('calendar')}
function cancelOccurrence(id,date){state.eventOverrides[id+'|'+date]={cancelled:true};save();closeModal();go('calendar')}
function editEvent(id){let e=state.events.find(x=>x.id===id);openModal('editEvent',e)}
function openModal(type,arg){let b=document.getElementById('modalbox');let html='';if(type==='quick')html=`<h2>Quick add</h2><div class='row'><button onclick='closeModal();openModal("task")'>Task</button><button onclick='closeModal();openModal("topic")'>Study topic</button><button onclick='closeModal();openModal("event")'>Calendar event</button></div>`;
else if(type==='task')html=`<h2>New task</h2><div class='field'><label>Task</label><input id='f_title'></div><div class='field'><label>Category</label><select id='f_cat'><option>College</option><option>CLAT</option><option>Dance</option><option>Exercise</option><option>Personal</option></select></div><div class='field'><label>Due</label><input id='f_due' type='date'></div><button class='primary' onclick='addTask()'>Add task</button>`;
else if(type==='topic')html=`<h2>New sub-topic</h2><div class='field'><label>Section</label><select id='f_sec'>${Object.keys(state.topics).map(x=>`<option ${arg===x?'selected':''}>${x}</option>`).join('')}</select></div><div class='field'><label>Sub-topic</label><input id='f_topic'></div><button class='primary' onclick='addTopic()'>Add</button>`;
else if(type==='editOccurrence'){let e=arg.event,o=state.eventOverrides[e.id+'|'+arg.date]||{};let day=e.day;html=`<h2>${esc(e.title)} · ${new Date(arg.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h2><div class='muted small'>This changes only this occurrence. The recurring schedule stays intact.</div><div class='field'><label>Title</label><input id='f_evtitle' value='${esc(o.title||e.title)}'></div><div class='field'><label>Move to day</label><select id='f_day'>${days.map((x,i)=>`<option value='${i}' ${day===i?'selected':''}>${x}</option>`).join('')}</select></div><div class='row'><div class='field'><label>Start</label><input id='f_start' type='time' value='${o.start||e.start}'></div><div class='field'><label>End</label><input id='f_end' type='time' value='${o.end||e.end}'></div></div><div class='row'><button class='primary' onclick='saveOccurrence(${e.id},"${arg.date}")'>Save this occurrence</button><button class='danger' onclick='cancelOccurrence(${e.id},"${arg.date}")'>Cancel this occurrence</button></div><br><button onclick='closeModal();openModal("editEvent",${e.id})'>Edit recurring schedule</button>`;}
else if(type==='event'||type==='editEvent'){let e=arg||{};html=`<h2>${type==='event'?'New event':'Edit event'}</h2><div class='field'><label>Title</label><input id='f_evtitle' value='${esc(e.title||'')}'></div><div class='field'><label>Day</label><select id='f_day'>${days.map((x,i)=>`<option value='${i}' ${e.day===i?'selected':''}>${x}</option>`).join('')}</select></div><div class='row'><div class='field'><label>Start</label><input id='f_start' type='time' value='${e.start||'17:00'}'></div><div class='field'><label>End</label><input id='f_end' type='time' value='${e.end||'18:00'}'></div></div><div class='field'><label>Type</label><select id='f_type'><option value='fixed'>Recurring commitment</option><option value='flex'>Flexible</option></select></div><div class='row'><button class='primary' onclick='${type==='event'?'addEvent()':'saveEvent('+e.id+')'}'>Save</button>${type==='editEvent'?`<button class='danger' onclick='cancelEvent(${e.id})'>Cancel this occurrence</button><button class='danger' onclick='deleteEvent(${e.id})'>Delete</button>`:''}</div>`;}
else if(type==='checkin')html=`<h2>Session complete 🎉</h2><p><b>${esc(timer.topic)}</b></p><div class='field'><label>How did it go?</label><select id='c_diff'><option>Easy</option><option>Fine</option><option>Hard</option><option>Brutal</option></select></div><div class='field'><label>Focus (1–5)</label><input id='c_focus' type='number' min='1' max='5' value='4'></div><div class='field'><label>Did you accomplish what you planned?</label><select id='c_done'><option>Yes</option><option>Partially</option><option>No</option></select></div><button class='primary' onclick='saveSession()'>Save session</button>`;
else if(type==='test')html=`<h2>Log test</h2><div class='field'><label>Name</label><input id='t_name'></div><div class='row'><div class='field'><label>Score</label><input id='t_score' type='number'></div><div class='field'><label>Total</label><input id='t_total' type='number'></div></div><div class='field'><label>Topic</label><input id='t_topic'></div><button class='primary' onclick='addTest()'>Save</button>`;
else if(type==='mistake')html=`<h2>Log mistake</h2><div class='field'><label>Question/topic</label><input id='m_q'></div><div class='field'><label>Why did you get it wrong?</label><select id='m_r'><option>Didn't know</option><option>Forgot</option><option>Misunderstood</option><option>Careless</option><option>Time pressure</option></select></div><div class='field'><label>Correct concept</label><textarea id='m_c'></textarea></div><button class='primary' onclick='addMistake()'>Save</button>`;
else if(type==='reminder')html=`<h2>🔔 New reminder</h2><div class='field'><label>Reminder</label><input id='r_title' placeholder='e.g. Start CLAT study'></div><div class='field'><label>Time</label><input id='r_time' type='time' value='18:00'></div><div class='field'><label>Repeat</label><select id='r_repeat'><option>Daily</option>${days.map(d=>`<option>${d}</option>`).join('')}</select></div><button class='primary' onclick='addReminder()'>Save reminder</button>`;
else if(type==='tracker')html=`<h2>New tracker</h2><div class='field'><label>Name</label><input id='tr_name'></div><button class='primary' onclick='addTracker()'>Add</button>`;b.innerHTML=html+`<br><button onclick='closeModal()'>Close</button>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addTask(){state.tasks.unshift({id:Date.now(),title:document.getElementById('f_title').value,cat:document.getElementById('f_cat').value,due:document.getElementById('f_due').value,done:false});save();closeModal();render()}function addTopic(){let c=document.getElementById('f_sec').value,n=document.getElementById('f_topic').value.trim();if(n)state.topics[c].push({name:n,status:'Not started'});save();closeModal();go('study')}function addEvent(){state.events.push({id:Date.now(),title:document.getElementById('f_evtitle').value,day:+document.getElementById('f_day').value,start:document.getElementById('f_start').value,end:document.getElementById('f_end').value,type:document.getElementById('f_type').value,active:true});save();closeModal();go('calendar')}function saveEvent(id){let e=state.events.find(x=>x.id===id);Object.assign(e,{title:document.getElementById('f_evtitle').value,day:+document.getElementById('f_day').value,start:document.getElementById('f_start').value,end:document.getElementById('f_end').value,type:document.getElementById('f_type').value});save();closeModal();go('calendar')}function cancelEvent(id){state.events.find(x=>x.id===id).active=false;save();closeModal();go('calendar')}function deleteEvent(id){state.events=state.events.filter(x=>x.id!==id);save();closeModal();go('calendar')}function saveSession(){state.sessions.push({topic:timer.topic,diff:document.getElementById('c_diff').value,focus:+document.getElementById('c_focus').value,done:document.getElementById('c_done').value,date:new Date().toISOString()});save();closeModal();resetTimer();go('home')}function addTest(){state.tests.push({name:document.getElementById('t_name').value,score:+document.getElementById('t_score').value,total:+document.getElementById('t_total').value,topic:document.getElementById('t_topic').value,date:new Date().toLocaleDateString()});save();closeModal();go('tests')}function addMistake(){state.mistakes.unshift({question:document.getElementById('m_q').value,reason:document.getElementById('m_r').value,correct:document.getElementById('m_c').value});save();closeModal();go('tests')}function addReminder(){let title=document.getElementById('r_title').value.trim();if(!title)return;state.settings.reminders.push({id:Date.now(),title,time:document.getElementById('r_time').value,repeat:document.getElementById('r_repeat').value,last:''});save();closeModal();go('settings')}function addTracker(){state.trackers.push({name:document.getElementById('tr_name').value,done:false});save();closeModal();go('track')}
applyTheme(); nav();render(); checkReminders();
</script><script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script>
</body></html>
